name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: pip install python-semantic-release build

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: "false"

      - name: Build package
        if: steps.release.outputs.released == 'true'
        run: python -m build

      # To enable PyPI publishing, either:
      # 1. Configure a trusted publisher on PyPI for this repo/workflow, or
      # 2. Add a PYPI_API_TOKEN secret in repo settings
      - name: Check PyPI token
        if: steps.release.outputs.released == 'true'
        id: pypi_check
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping PyPI publish — PYPI_API_TOKEN secret is not set"
          fi
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true' && steps.pypi_check.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
