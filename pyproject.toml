[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-pipeline"
version = "0.1.0"
description = "Multilingual OCR pipeline with Ollama vision LLMs and PyTesseract, auto-fallback, and confidence scoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yashodhank", email = "yashodhank@users.noreply.github.com" },
]
keywords = ["ocr", "tesseract", "ollama", "pdf", "multilingual", "devanagari", "hindi", "marathi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16",
    "ollama>=0.4.0",
    "httpx>=0.25.0",
    "numpy>=1.24",
    "rich>=13.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
ocr-pipeline = "ocr_cli:main"

[project.urls]
Homepage = "https://github.com/yashodhank/ocr-pipeline"
Repository = "https://github.com/yashodhank/ocr-pipeline"
Issues = "https://github.com/yashodhank/ocr-pipeline/issues"

[tool.setuptools]
py-modules = ["ocr_engine", "ocr_cli", "ocr_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): {version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "build"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
